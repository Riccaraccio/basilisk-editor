name: Editor report
description: Tried an editor configuration from editors/ (Helix, Sublime Text, Kate, coc.nvim, ALE)? Tell us whether it works.
labels: [editor-report]
body:
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [Helix, Sublime Text, Kate, coc.nvim, ALE, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Editor version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: The language server starts for Basilisk files
        - label: qcc errors are shown
        - label: Hover documentation (e.g. on `foreach`)
        - label: Completion
        - label: Go to definition (e.g. into a Basilisk header)
  - type: textarea
    id: notes
    attributes:
      label: Changes you needed to the configuration, problems, notes
