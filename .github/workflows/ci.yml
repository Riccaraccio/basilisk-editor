name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Server, generator and diagnostics tests (no qcc needed: recorded
  # outputs are replayed), on the oldest and newest supported Pythons and
  # on macOS. Editor and Basilisk tests skip themselves here.
  #
  # Tests needing a real Basilisk (qcc) run locally only: basilisk.fr
  # refuses connections from GitHub's runners (decision D6 in PLAN.md).
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Generated files are up to date
        run: python tools/generate.py --check
      - name: Versions agree
        run: |
          server=$(python -c "import re; print(re.search(r'^VERSION = \"(.+)\"', open('server/basilisk_lsp.py').read(), re.M).group(1))")
          vscode=$(python -c "import json; print(json.load(open('vscode/package.json'))['version'])")
          el=$(sed -n 's/^;; Version: //p' basilisk-editor.el)
          echo "server $server, vscode $vscode, emacs $el"
          test "$server" = "$vscode" && test "$server" = "$el"
      - name: Tests
        run: python -m unittest discover -s tests -v

  # Editors without Basilisk: detection, highlighting, language server
  # attach and hover (qcc-free parts), on neovim 0.11 and stable.
  editors:
    name: editors (neovim ${{ matrix.nvim }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.11.0, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install vim, Emacs, nano, tmux
        run: sudo apt-get update && sudo apt-get install -y vim emacs-nox nano tmux
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VS Code grammar
        working-directory: tests/vscode
        run: npm ci && npm test
      - name: Editor tests
        run: python3 -m unittest tests.test_editors tests.test_generate -v

  # The VS Code extension builds with the official packager (as on release).
  vsix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the extension
        working-directory: vscode
        run: |
          mkdir -p server
          cp ../server/basilisk_lsp.py server/
          cp ../LICENSE .
          npm ci --omit=dev
          npx --yes @vscode/vsce@3 package
          unzip -l basilisk-c-*.vsix | grep -E 'extension/(server/basilisk_lsp.py|extension.js|LICENSE|node_modules/vscode-languageclient/package.json)'
      - uses: actions/upload-artifact@v4
        with:
          name: basilisk-c-vsix
          path: vscode/basilisk-c-*.vsix
